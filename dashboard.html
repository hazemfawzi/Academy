<style>
:root{
  --bg:#f6f3f3;--card:#fff;--ink:#1a1414;--muted:#7a6e6e;--line:#ece4e4;
  --brand:#1f4637;--brand2:#2d604c;--lime:#ff4d4d;--navy:#111111;
  --red:#d64545;--redbg:#fde8e8;--orange:#d9822b;--orbg:#fdf0e1;--blue:#2f6fd6;--bluebg:#e6effc;
  --greenbg:#e3f6ea;--radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:AcademyPlex,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:250px;background:var(--navy);color:#e8dede;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;padding:20px 18px;border-bottom:1px solid #2a2a2a}
.logo .ball{width:40px;height:40px;border-radius:12px;background:var(--lime);display:grid;place-items:center;color:var(--navy);font-weight:800;font-size:20px}
.logo b{display:block;color:#fff;font-size:18px}.logo small{font-size:11px;color:#b9a5a5}
.nav{padding:12px 10px;flex:1}
.nav .grp{font-size:11px;color:#9a8585;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:#e8dede;text-decoration:none;font-weight:600;font-size:13.5px;margin-bottom:2px}
.nav a:hover{background:#1f1f1f}
.nav a.on{background:var(--brand2);color:#fff}
.nav a .ic{width:20px;text-align:center}
.nav a .tag{margin-inline-start:auto;font-size:10px;background:var(--brand2);color:#fff;border-radius:6px;padding:0 6px;font-weight:700}
.side .foot{padding:14px;border-top:1px solid #2a2a2a;font-size:12px}
.plan{background:#1f1f1f;border-radius:10px;padding:10px}
.bar{height:6px;background:#3a3a3a;border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--lime)}
/* main */
.main{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 26px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:800}
.top .sp{flex:1}
.sel{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff}
.btn{border:0;border-radius:10px;padding:8px 14px;font-weight:700;background:var(--brand2);color:#fff;font-size:13px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.wa{background:#25d366}
.btn.sm{padding:5px 10px;font-size:12px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700}
.legend{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.content{padding:22px 26px 60px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:2fr 1fr}.g2e{grid-template-columns:1fr 1fr}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:18px}
.card h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.kpi .v{font-size:26px;font-weight:800;margin-top:4px}.kpi .l{color:var(--muted);font-size:12.5px}
.kpi .d{font-size:12px;margin-top:4px}.up{color:var(--brand2)}.down{color:var(--red)}
.badge{display:inline-block;padding:1px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
.b-green{background:var(--greenbg);color:#137a3f}.b-red{background:var(--redbg);color:var(--red)}.b-or{background:var(--orbg);color:var(--orange)}.b-blue{background:var(--bluebg);color:var(--blue)}.b-gray{background:#f2eded;color:var(--muted)}
.star{background:#e6f0ea;color:#b3141b;border:1px solid #f3c2c4;font-size:10.5px;padding:0 7px;border-radius:6px;font-weight:700}
.ph2{background:#efe9fb;color:#6b46c1;border:1px solid #d9cdf5;font-size:10.5px;padding:0 7px;border-radius:6px;font-weight:700}
table{width:100%;border-collapse:collapse}
th{text-align:right;font-size:12px;color:var(--muted);font-weight:700;padding:9px 8px;border-bottom:1px solid var(--line);background:#fbf9f9}
td{padding:10px 8px;border-bottom:1px solid #f3eeee;vertical-align:middle}
tr.click:hover td{background:#fcf6f6;cursor:pointer}
.list .it{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f3eeee}
.list .it:last-child{border:0}
.mini{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:#f8e5e5;color:var(--brand)}
.muted{color:var(--muted);font-size:12.5px}
.f1{flex:1}
.cap{height:7px;background:#f1eaea;border-radius:5px;overflow:hidden;width:110px}.cap i{display:block;height:100%;background:var(--brand2)}
.cap.full i{background:var(--red)}
.sched{display:grid;grid-template-columns:80px repeat(6,1fr);gap:6px}
.sched .h{font-weight:700;font-size:12px;color:var(--muted);text-align:center;padding:6px}
.sched .t{font-size:12px;color:var(--muted);display:flex;align-items:center}
.slot{background:#e6f0ea;border-inline-start:3px solid var(--brand2);border-radius:8px;padding:6px 8px;font-size:11.5px;min-height:46px}
.slot b{display:block;font-size:12px}
.slot.b2{background:var(--bluebg);border-color:var(--blue)}.slot.b3{background:var(--orbg);border-color:var(--orange)}
.empty{min-height:46px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-weight:700;font-size:12.5px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.plancard{border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center}
.plancard .p{font-size:24px;font-weight:800;color:var(--brand)}
.toggle{width:40px;height:22px;border-radius:20px;background:#d9cfcf;position:relative;border:0;flex-shrink:0}
.toggle.on{background:var(--brand2)}
.toggle::after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on::after{right:21px}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid #cdbfbf;display:grid;place-items:center;flex-shrink:0;background:#fff;font-size:13px;color:#fff}
.chk.on{background:var(--brand2);border-color:var(--brand2)}
.pitch{background:linear-gradient(135deg,#1f4637,#2d604c);border-radius:14px;padding:16px;color:#fff;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.team{background:rgba(255,255,255,.12);border-radius:10px;padding:12px}
.team h4{margin-bottom:8px}
.team div{padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.25);font-size:13px;display:flex;justify-content:space-between}
.score{display:flex;align-items:center;justify-content:center;gap:16px;font-size:34px;font-weight:800;margin:10px 0}
.score input{width:70px;text-align:center;font-size:28px;font-weight:800;border:2px solid var(--line);border-radius:10px;padding:4px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:13px}
.alert.r{background:var(--redbg)}.alert.o{background:var(--orbg)}.alert.g{background:var(--greenbg)}
/* phones */
.phones{display:flex;gap:30px;flex-wrap:wrap;justify-content:center}
.phone{width:290px;height:590px;border-radius:38px;background:#0d1b16;padding:12px;box-shadow:0 20px 40px rgba(0,0,0,.18)}
.screen{width:100%;height:100%;border-radius:28px;background:#f3f5f4;overflow:hidden;display:flex;flex-direction:column}
.ph-top{background:var(--brand);color:#fff;padding:22px 16px 16px}
.ph-top small{opacity:.8}
.ph-body{padding:12px;overflow-y:auto;flex:1}
.ph-card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;font-size:12.5px}
.ph-nav{display:flex;justify-content:space-around;background:#fff;padding:10px 0;border-top:1px solid var(--line);font-size:18px}
/* drawer/modal */
.ov{position:fixed;inset:0;background:rgba(13,27,22,.45);display:none;z-index:20}
.ov.show{display:block}
.drawer{position:fixed;top:0;left:0;height:100vh;width:min(520px,100vw);background:#fff;z-index:21;transform:translateX(-100%);transition:.25s;overflow-y:auto;padding:22px}
.drawer.show{transform:none}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.96);width:min(460px,92vw);background:#fff;border-radius:16px;padding:22px;z-index:22;display:none}
.modal.show{display:block;transform:translate(-50%,-50%)}
.x{float:left;border:0;background:#f2eded;border-radius:8px;width:30px;height:30px;font-size:16px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;z-index:30;pointer-events:none}
.toast.show{opacity:1}
.menu-btn{display:none;border:0;background:#f2eded;border-radius:10px;width:38px;height:38px;font-size:18px}
.ch{position:relative;height:240px}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.g2,.g2e{grid-template-columns:1fr}}
@media (max-width:760px){
  .side{position:fixed;right:-260px;z-index:25;transition:.25s}.side.show{right:0}
  .menu-btn{display:block}.content{padding:16px}.top{padding:12px 16px}
  .g4,.g3{grid-template-columns:1fr 1fr}.legend{display:none}
  .sched{overflow-x:auto;grid-template-columns:70px repeat(6,120px)}
  .tbl-wrap{overflow-x:auto}
  .pitch{grid-template-columns:1fr}
}

.pos.gk{background:#fff4cc;color:#8a6a00}
.big{font-size:16px;padding:12px 18px;width:100%}
.macro{display:flex;height:8px;border-radius:5px;overflow:hidden;margin:8px 0}
.cellc{display:flex;justify-content:center}
.chk[disabled]{opacity:.55;cursor:not-allowed}
.grip{color:#bdb1af;touch-action:none;cursor:grab;padding:6px 3px;display:grid;place-items:center;flex-shrink:0;margin-inline-start:-6px}
.grip:active{cursor:grabbing;color:#2d604c}
.drag-ghost{position:fixed;z-index:9999;pointer-events:none;background:#fff;box-shadow:0 18px 40px rgba(0,0,0,.28);border-radius:14px;transform:rotate(-2deg) scale(1.04);display:flex;align-items:center;gap:8px;padding:10px 14px;font-family:AcademyPlex,sans-serif;font-size:14px}
.drag-src{opacity:.3}
.drop-on{outline:3px dashed #2d604c;outline-offset:3px;transform:scale(1.015);transition:transform .12s}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}

users(){
  const t=state.permTab;
  const tabs=`<div class="tabs">${[["coaches","🏃 المدربين والأخصائيين"],["staff","🗂️ الموظفين والإدارة"],["incent","🎁 برنامج الحوافز"],["roles","🔐 صلاحيات الموظفين"],["matrix","📍 خريطة الفروع"]].map(([k,l])=>`<button class="${t===k?'on':''}" onclick="state.permTab='${k}';render()">${l}</button>`).join("")}</div>`;
  const brOk=a=>state.branch==="all"||a==="all"||a.includes(state.branch);
  const brCell=a=>a==="all"?'<span class="badge b-blue">كل الفروع</span>':a.map(b=>`<span class="badge b-gray" style="margin:1px">${b}</span>`).join("");
  if(t==="coaches"){
    const cs=COACHES.map((c,i)=>({c,i})).filter(({c})=>brOk(c.br)),noHead=fb(GROUPS).filter(g=>!g.coaches.some(c=>c[1]==="رئيسي"));
    return tabs+`<div class="grid g4">${[["مدربين",COACHES.filter(c=>c.spec.startsWith("مدرب")).length],["أخصائيين",COACHES.filter(c=>c.spec.startsWith("أخصائي")).length],["جروبات ليها مدرب رئيسي",(fb(GROUPS).length-noHead.length)+" / "+fb(GROUPS).length],["حسابات موقوفة",COACHES.filter(c=>!c.act).length]].map(([l,v])=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("")}</div>
    ${noHead.length?`<div class="alert r" style="margin-top:16px">⚠️<div class="f1"><b>${noHead.length} جروب من غير مدرب رئيسي</b><div class="muted">${noHead.map(g=>g.name+" · "+g.br).join("، ")}</div></div></div>`:''}
    <div class="card" style="margin-top:16px"><h3>المدربين والأخصائيين<span class="sp"></span><button class="btn sm" onclick="coachDrawer(-1)">+ مدرب / أخصائي</button></h3>
    <div class="muted" style="margin-bottom:10px">بيشتغلوا من تطبيق المدرب على جروباتهم بس. لما تختار الفرع بتظهرلك جروباته تعيّنه عليها وتحدد دوره في كل جروب.</div>
    <div class="tbl-wrap"><table><tr><th>الاسم</th><th>التخصص</th><th>الفروع</th><th>الجروبات ودوره فيها</th><th>الحالة</th><th></th></tr>
    ${cs.map(({c,i})=>{const gs=coachGroups(c.n);return `<tr><td><div style="display:flex;align-items:center;gap:8px"><div class="mini">${ini(c.n.replace(/^(كابتن|د\.)\s*/,''))}</div><b style="cursor:pointer;color:var(--brand2)" onclick="openCoach(${i})">${c.n} ↗</b></div></td><td><span class="badge ${c.spec.startsWith('أخصائي')?'b-or':'b-blue'}">${c.spec}</span></td><td>${brCell(c.br)}</td><td>${gs.length?gs.map(([g,r])=>`<span class="badge b-gray" style="margin:1px">${g.name} · ${r}</span>`).join(""):'<span class="muted">على مستوى الفرع</span>'}</td><td><span class="badge ${c.act?'b-green':'b-red'}">${c.act?'نشط':'موقوف'}</span></td><td><button class="btn sm ghost" onclick="coachDrawer(${i})">تعديل</button></td></tr>`}).join("")}</table></div></div>`;
  }
  if(t==="staff"){
    const us=USERS.map((u,i)=>({u,i})).filter(({u})=>brOk(u.br));
    return tabs+`<div class="card"><h3>الموظفين والإدارة<span class="sp"></span><button class="btn sm" onclick="staffDrawer(-1)">+ موظف</button></h3>
    <div class="muted" style="margin-bottom:10px">الفريق الدائم اللي بيدير النادي إدارياً من لوحة التحكم وتطبيق الإدارة: المدير والكاشير والاستقبال. صلاحياتهم جاية من دورهم، ونطاقهم من الفروع المحددة.</div>
    <div class="tbl-wrap"><table><tr><th>الاسم</th><th>الدور</th><th>الفروع</th><th>الدخول على</th><th>الحالة</th><th></th></tr>
    ${us.map(({u,i})=>`<tr><td><div style="display:flex;align-items:center;gap:8px"><div class="mini">${ini(u.n.replace(/^أ\.\s*/,''))}</div><b>${u.n}</b></div></td><td><span class="badge b-gray">${u.role}</span></td><td>${brCell(u.br)}</td><td>${u.web?'<span class="badge b-blue">🖥️ لوحة التحكم</span> ':''}${u.mob?'<span class="badge b-blue">📱 تطبيق الإدارة</span>':''}</td><td><span class="badge ${u.act?'b-green':'b-red'}">${u.act?'نشط':'موقوف'}</span></td><td><button class="btn sm ghost" onclick="staffDrawer(${i})">تعديل</button></td></tr>`).join("")}</table></div></div>`;
  }
  if(t==="incent") return tabs+incentTab();
  if(t==="matrix") return tabs+`<div class="card"><h3>مين شغال في أنهي فرع</h3><div class="tbl-wrap"><table><tr><th>الاسم</th><th>النوع</th>${BR.map(b=>`<th style="text-align:center">${b}</th>`).join("")}</tr>
    <tr><td colspan="${2+BR.length}" style="background:#fbf7f7;font-weight:800">🗂️ الموظفين والإدارة</td></tr>
    ${USERS.map(u=>`<tr><td><b>${u.n}</b></td><td><span class="badge b-gray">${u.role}</span></td>${BR.map(b=>`<td><div class="cellc">${u.br==="all"||u.br.includes(b)?`<span class="badge b-green">${u.br==="all"?"كامل":"✓"}</span>`:'<span class="muted">—</span>'}</div></td>`).join("")}</tr>`).join("")}
    <tr><td colspan="${2+BR.length}" style="background:#fbf7f7;font-weight:800">🏃 المدربين والأخصائيين</td></tr>
    ${COACHES.map(c=>`<tr><td><b>${c.n}</b></td><td><span class="badge ${c.spec.startsWith('أخصائي')?'b-or':'b-blue'}">${c.spec}</span></td>${BR.map(b=>{const k=coachGroups(c.n).filter(([g])=>g.br===b).length;return `<td><div class="cellc">${c.br.includes(b)?`<span class="badge b-green">${k?k+" جروب":"✓"}</span>`:'<span class="muted">—</span>'}</div></td>`}).join("")}</tr>`).join("")}</table></div></div>`;
  if(!ADMIN_ROLES.includes(state.role))state.role='مدير فرع';const r=state.role,P=PERMS[r],own=r==='مالك';
  const rb=x=>`<button class="${x===r?'on':''}" onclick="state.role='${x}';render()">${x} (${roleCount(x)})</button>`;
  return tabs+`<div class="card"><h3>اختار الدور<span class="sp"></span><button class="btn sm ghost" onclick="newRole()">+ دور مخصص</button></h3>
    <div class="muted" style="margin-bottom:8px">الصلاحيات هنا للموظفين بس. المدرب أو الأخصائي بيتحكم في جروباته وأنشطته بس، من غير أدوار.</div><div class="tabs">${ADMIN_ROLES.map(rb).join("")}</div>
    <div class="muted">${ROLE_DESC[r]||'دور مخصص، حدد صلاحياته من الجدول.'}</div></div>
    <div class="card" style="margin-top:16px"><h3>صلاحيات «${r}» لكل خاصية<span class="sp"></span>${own?'':`<button class="btn sm ghost" onclick="permAll(1)">تحديد الكل</button><button class="btn sm ghost" onclick="permAll(0)">مسح الكل</button>`}<button class="btn sm" onclick="toast('اتحفظت صلاحيات ${r}')">حفظ</button></h3>
    <div class="tbl-wrap"><table><tr><th>الخاصية</th>${ACTS.map(a=>`<th style="text-align:center">${a}</th>`).join("")}</tr>
    ${FEATS.map((f,fi)=>`<tr><td><b>${f[0]}</b><div class="muted">${f[1]}</div></td>${ACTS.map((a,ai)=>{const v=P[fi][ai];return `<td><div class="cellc">${v===null?'<span class="muted">—</span>':`<button class="chk ${v?'on':''}" ${own?'disabled':''} onclick="togglePerm(${fi},${ai})">${v?'✓':''}</button>`}</div></td>`}).join("")}</tr>`).join("")}</table></div>
    ${own?'<div class="muted" style="margin-top:8px">المالك له كل الصلاحيات ومينفعش تتعدل.</div>':''}</div>
    <div class="card" style="margin-top:16px"><h3>نطاق البيانات والقيود</h3><div class="list">
     ${LIMITS.map((l,i)=>`<div class="it"><div class="f1"><b>${l[0]}</b><div class="muted">${l[1]}</div></div>${l[2]==='t'?`<button class="toggle ${LIMV[r][i]?'on':''}" ${own?'disabled':''} onclick="this.classList.toggle('on')"></button>`:`<select class="sel" ${own?'disabled':''}>${l[3].map(o=>`<option ${LIMV[r][i]===o?'selected':''}>${o}</option>`).join("")}</select>`}</div>`).join("")}</div></div>`;
},

coach(){
  const i=state.cid,c=COACHES[i],gs=coachGroups(c.n),R=coachRating(i),t=state.ctab||"activity",isN=c.spec==="أخصائي تغذية";
  const kpi=(l,v,d)=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div>${d?`<div class="d muted">${d}</div>`:''}</div>`;
  const inc=incCalc(i);
  let body="";
  if(t==="activity") body=`<div class="grid g2"><div class="card"><h3>آخر الأنشطة</h3><div class="list">${coachLog(c).map(a=>`<div class="it"><div class="mini">${a[1]}</div><div class="f1"><b>${a[2]}</b><div class="muted">${a[0]}${a[3]?' · '+a[3]:''}</div></div></div>`).join("")}</div></div>
   <div class="card"><h3>جروباته</h3>${gs.length?`<table><tr><th>الجروب</th><th>دوره</th><th>الأعضاء</th><th>الحضور</th><th>حصص الشهر</th></tr>${gs.map(([g,r],k)=>`<tr class="click" onclick="openGroup(${g.id})"><td><b>${g.name}</b></td><td><span class="badge b-gray">${r}</span></td><td>${g.n}</td><td>${[86,91,72,80,77][k%5]}%</td><td>${g.days.length*4-(k%2)} / ${g.days.length*4}</td></tr>`).join("")}</table>`:'<div class="muted">شغال على مستوى الفرع، مش متعيّن على جروب.</div>'}
   <div class="alert o" style="margin-top:12px">🔒<div class="f1">المدرب بيشوف ويتحكم في الجروبات دي وأنشطتها بس.</div></div></div></div>`;
  if(t==="ratings") body=`<div class="grid g2e"><div class="card"><h3>تقييم الأعضاء ليه</h3><div style="display:flex;gap:16px;align-items:center"><div style="text-align:center"><div style="font-size:40px;font-weight:800">${R.avg}</div><div style="color:#d9822b;font-size:18px">${"★".repeat(Math.round(R.avg))}</div><div class="muted">${R.n} تقييم · ${R.month}</div></div><div class="f1">${[5,4,3,2,1].map((s,k)=>`<div style="display:flex;align-items:center;gap:8px;margin:3px 0"><span style="width:28px">${s}★</span><div class="bar" style="flex:1;background:#efe8e8;height:8px"><i style="width:${R.dist[k]}%;background:#d9822b"></i></div><span class="muted" style="width:34px">${R.dist[k]}%</span></div>`).join("")}</div></div>
    <h3 style="margin-top:16px">حسب المعيار</h3>${R.crit.map(([n,v])=>`<div style="display:flex;align-items:center;gap:8px;margin:6px 0"><span style="width:150px">${n}</span><div class="bar" style="flex:1;background:#efe8e8;height:8px"><i style="width:${v*20}%;background:#111"></i></div><b>${v}</b></div>`).join("")}
    <div class="muted" style="margin-top:10px">الأعضاء بيقيّموا مدربهم مرة في الشهر من تطبيقهم، والتقييم سري.</div></div>
   <div class="card"><h3>آراء الأعضاء</h3><div class="list">${R.comments.map(x=>`<div class="it"><div class="f1"><div style="color:#d9822b">${"★".repeat(x[0])}</div><div>${x[1]}</div><div class="muted">${x[2]}</div></div></div>`).join("")}</div>
    <h3 style="margin-top:14px">آخر 4 شهور</h3><div class="list">${R.trend.map(x=>`<div class="it"><b class="f1">${x[0]}</b><span style="color:#d9822b">${x[1]} ★</span></div>`).join("")}</div></div></div>`;
  if(t==="incent") body=`<div class="grid g2"><div class="card"><h3>حوافز ${MONTH}<span class="sp"></span><button class="btn sm ghost" onclick="state.permTab='incent';go('users')">⚙️ قواعد البرنامج</button></h3><div class="tbl-wrap"><table><tr><th>المؤشر</th><th>الهدف</th><th>الفعلي</th><th></th><th>المبلغ</th></tr>
    ${inc.rows.map(r=>`<tr><td><b>${r.n}</b></td><td class="muted">${r.tgtTxt}</td><td><b>${r.val}${r.u==='%'?'%':' '+r.u}</b></td><td>${r.per?'':r.ok?'<span class="badge b-green">✓ اتحقق</span>':'<span class="badge b-gray">لسه</span>'}</td><td style="color:${r.earn<0?'var(--red)':r.earn?'#137a3f':'inherit'};font-weight:800">${r.earn>0?'+':''}${r.earn} ج</td></tr>`).join("")}

const LN=["سامي","عادل","طارق","حسن","خالد","إبراهيم","فؤاد","ممدوح","نبيل","رضا","علاء","وليد","منير","حمدي","جمال","سعيد","عاطف","سمير","شوقي","فتحي","عزت","كمال","ماهر","جلال","ناجي","الشاذلي","عبدالله","رأفت","صبري","مجدي","حلمي","يسري","البنا","زكي","شاكر"];

const PLAYERS=[];
(function(){const used=new Set();let s=7;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
 GROUPS.forEach(g=>{MEM.filter(m=>m.g===g.id).forEach(m=>{used.add(m.n);PLAYERS.push({n:m.n,g:g.id,lvl:m.lvl,pos:POSL[Math.floor(rnd()*8)],goals:m.goals,ast:m.ast,mvp:m.mvp,att:m.att,st:m.st,pay:m.pay})});
  while(PLAYERS.filter(p=>p.g===g.id).length<g.n){let n;do{n=FN[Math.floor(rnd()*FN.length)]+" "+LN[Math.floor(rnd()*LN.length)]}while(used.has(n));used.add(n);
   const k=PLAYERS.filter(p=>p.g===g.id).length,lvl=1+Math.floor(rnd()*5),r=rnd(),st=r<.12?"متأخر":r<.22?"ينتهي قريباً":"نشط";
   PLAYERS.push({n,g:g.id,lvl,pos:(k===2||k===9)?"حارس":POSL[Math.floor(rnd()*8)],goals:Math.round(rnd()*lvl*4),ast:Math.round(rnd()*lvl*3),mvp:Math.round(rnd()*lvl/1.5),att:Math.round(45+rnd()*53),st,pay:st==="متأخر"?"متأخر 900 ج":"مدفوع"})}});})();

const CRIT=["اللياقة","التحكم والمهارة","التمرير","التسديد والإنهاء","الدفاع والتمركز"];
const RW={c:50,p:35,v:15};
const RATE={};
PLAYERS.forEach((p,i)=>{const c=CRIT.map((_,j)=>Math.max(1,Math.min(5,p.lvl+(j%2?((i+j)%3)-1:0))));const m=i%7===6?3:6+((i*5)%14);const wr=Math.max(20,Math.min(80,30+p.lvl*9+((i*13)%15)-7));const perf=Math.round(Math.max(15,Math.min(95,wr*.6+p.lvl*7+((i*7)%10))));const peer=Math.round(Math.max(20,Math.min(95,p.lvl*17+((i*11)%15)-5)));const g=GROUPS.find(x=>x.id===p.g);
 RATE[p.n]={c,gk:p.pos==="حارس"?Math.min(5,3+(i%3)):(i%6===0?2:null),m,wr,perf,peer,trend:((i*3)%5)-2,by:g.coaches[0][0],at:["12 سبتمبر","20 سبتمبر","1 أكتوبر"][i%3]}});

  rest.sort((a,b)=>b.lvl-a.lvl);
  rest.forEach(p=>{const minLen=Math.min(...teams.map(t=>t.pl.length));let best=null,bs=1e9;teams.forEach(t=>{if(t.pl.length!==minLen)return;const s=str(t)+t.pl.filter(x=>x.pos===p.pos).length*1.6+Math.random()*.4;if(s<bs){bs=s;best=t}});best.pl.push(p)});

function addGroup(){return `<h3 style="margin-bottom:14px">جروب جديد</h3><div class="field"><label>الاسم</label><input placeholder="جروب الصبح B"></div><div class="grid g2e" style="gap:10px"><div class="field"><label>الفرع</label><select id="agBr" onchange="$('agC').innerHTML=agList(this.value)">${BR.map(b=>`<option>${b}</option>`).join("")}</select></div><div class="field"><label>السعة</label><input type="number" value="20"></div><div class="field"><label>المستوى</label><select><option>مبتدئ</option><option>متوسط</option><option>متقدم</option></select></div><div class="field"><label>الميعاد</label><input type="time" value="19:00"></div></div>
<div class="field"><label>الأيام</label><div class="tabs">${DAYS.map(d=>`<button onclick="this.classList.toggle('on')">${d}</button>`).join("")}</div></div>
<div class="field"><label>المدربين والأخصائيين في الفرع ده (اختار أكتر من واحد ودور كل واحد)</label><div class="list" id="agC">${agList(BR[0])}</div></div>
<button class="btn" onclick="closeAll();toast('الجروب اتضاف والحصص اتولدت')">حفظ</button>`}
function agList(b){const cs=COACHES.filter(c=>c.br.includes(b)&&c.act);return cs.length?cs.map(c=>`<div class="it"><button class="chk" onclick="this.classList.toggle('on');this.textContent=this.classList.contains('on')?'✓':''"></button><span class="f1">${c.n} <span class="muted">· ${c.spec}</span></span><select class="sel" style="padding:4px 8px">${CROLES.map(r=>`<option ${r===SPEC_ROLE[c.spec]?'selected':''}>${r}</option>`).join("")}</select></div>`).join(""):'<div class="muted">مفيش مدربين في الفرع ده. ضيفهم من المستخدمين.</div>'}
function addMember(){return `<h3 style="margin-bottom:14px">عضو جديد</h3><div class="field"><label>الاسم</label><input></div><div class="field"><label>الموبايل (واتساب)</label><input dir="ltr" placeholder="01xxxxxxxxx"></div><div class="field"><label>الجروب</label><select>${GROUPS.map(g=>`<option>${g.name} · ${g.br}${g.n>=g.cap?' (كامل، قائمة انتظار)':''}</option>`).join("")}</select></div><div class="field"><label>الباقة</label><select><option>شهري · 900 ج</option><option>3 شهور · 2,400 ج</option></select></div><button class="btn" onclick="closeAll();toast('اتسجل واتبعتله لينك البوابة')">تسجيل وإرسال لينك البوابة</button>`}
function importX(){return `<h3 style="margin-bottom:14px">استيراد أعضاء من Excel</h3><div style="border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center" class="muted">📄 اسحب الملف هنا أو اضغط للاختيار</div><div class="list" style="margin-top:12px"><div class="it"><span class="f1">عمود "الاسم"</span><span class="badge b-green">← الاسم</span></div><div class="it"><span class="f1">عمود "التليفون"</span><span class="badge b-green">← الموبايل</span></div><div class="it"><span class="f1">عمود "المجموعة"</span><span class="badge b-green">← الجروب</span></div></div><div class="alert o" style="margin-top:10px">⚠️ 3 صفوف أرقامها ناقصة، هتتراجع قبل الاستيراد</div><button class="btn" onclick="closeAll();toast('اتستورد 84 عضو')">استيراد 84 عضو</button>`}

<div class="field"><label>البرنامج</label><select>${PROGS.map(x=>`<option ${x.n===p?'selected':''}>${x.n}</option>`).join("")}</select></div>

<div id="tg"><div class="chips">${GROUPS.map(g=>`<button class="pchip" onclick="this.classList.toggle('on')">${g.name} · ${g.br}</button>`).join("")}</div></div>
<div id="ti" style="display:none"><input class="sel" style="width:100%;margin-bottom:8px" placeholder="🔍 ابحث عن عضو"><div class="chips">${MEM.map(m=>`<button class="pchip" onclick="this.classList.toggle('on')">${m.n}</button>`).join("")}</div>
<label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" checked> انسخه كبرنامج فردي عشان أعدّله لكل عضو</label></div>

<button class="btn" onclick="closeAll();toast('البرنامج اتعيّن')">تعيين</button>`}

name: Deploy academy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: academy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify application
        run: node --test tests.cjs academy-model.test.cjs
      - name: Prepare static files
        run: |
          python3 scripts/prepare-static.py
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'server1.view-mind.com' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'viewmind' }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/viewmind/public_html/Kora-Gym' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          EXPECTED_HOST_FINGERPRINT: SHA256:qHouKFK2hEu62cJ3zpVzoga5JMkeW5UhHnxeC6gtrD0
        shell: bash
        run: |
          set -euo pipefail
          error_log=$(mktemp)
          exec 2> >(tee "$error_log" >&2)
          report_failure() {
            status=$?
            if (( status != 0 )); then
              message=$(tail -n 12 "$error_log")
              message=${message//'%'/'%25'}
              message=${message//$'\r'/'%0D'}
              message=${message//$'\n'/'%0A'}
              echo "::error title=SSH deployment diagnostic::$message"
            fi
          }
          trap report_failure EXIT
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}"
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/home/[a-zA-Z0-9_./-]+$ ]]
          [[ "$DEPLOY_PATH" != *'/../'* && "$DEPLOY_PATH" != */.. ]]
          key_dir=$(mktemp -d)
          cleanup() { report_failure; rm -rf "$key_dir" "$error_log"; }
          trap cleanup EXIT
          chmod 700 "$key_dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_dir/key"
          ssh-keyscan -T 15 -p "$DEPLOY_PORT" -t ed25519 "$DEPLOY_HOST" > "$key_dir/known_hosts"
          [[ -s "$key_dir/known_hosts" ]]
          fingerprints=$(ssh-keygen -lf "$key_dir/known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          if [[ "$fingerprints" != "$EXPECTED_HOST_FINGERPRINT" ]]; then
            echo 'SSH server fingerprint did not match. Deployment stopped.' >&2
            exit 1
          fi
          chmod 600 "$key_dir/key" "$key_dir/known_hosts"
          remote_shell="ssh -p $DEPLOY_PORT -i $key_dir/key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$key_dir/known_hosts"
          # rsync must be installed on the hosting server. No remote deletion.
          backup_path="${DEPLOY_PATH%/}.deploy-backups/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rsync -az --protect-args --delay-updates --backup --backup-dir="$backup_path" \
            -e "$remote_shell" /tmp/academy-site/ "$DEPLOY_USER@$DEPLOY_HOST:${DEPLOY_PATH%/}/"
          ssh -p "$DEPLOY_PORT" -i "$key_dir/key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$key_dir/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$DEPLOY_PATH" < scripts/configure-cache.sh
      - name: Check published pages
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 https://store.view-mind.com/index.html -o /tmp/published-index.html
          grep -q 'أكاديمية النخبة' /tmp/published-index.html
          curl --fail --silent --show-error -D /tmp/academy-headers.txt https://store.view-mind.com/dashboard.html -o /tmp/academy-dashboard.html
          grep -qi 'cache-control:.*no-store' /tmp/academy-headers.txt
          grep -q 'journey.js?v=' /tmp/academy-dashboard.html
          curl --fail --silent --show-error https://store.view-mind.com/ -o /tmp/academy-root.html
          grep -q 'journey.js?v=\|landing.html' /tmp/academy-root.html
          curl --fail --silent --show-error https://store.view-mind.com/journey.js -o /tmp/published-journey.js
          cmp journey.js /tmp/published-journey.js
          curl --fail --silent --show-error https://store.view-mind.com/enrollment.js -o /tmp/published-enrollment.js
          cmp enrollment.js /tmp/published-enrollment.js
          curl --fail --silent --show-error https://store.view-mind.com/academy-ui.js -o /tmp/published-academy-ui.js
          cmp academy-ui.js /tmp/published-academy-ui.js
          curl --fail --silent --show-error --location https://store.view-mind.com/kora-gym-dashboard.html -o /tmp/academy-legacy-dashboard.html
          grep -q 'journey.js?v=' /tmp/academy-legacy-dashboard.html
          grep -q 'كل الرياضات في مكان واحد' /tmp/academy-root.html

<style>
:root{color-scheme:light;--bg:#f4f1f1;--card:#fff;--ink:#17110f;--ink2:#4b4140;--mut:#8b7f7d;--line:#efe9e8;--red:#2d604c;--red2:#1f4637;--redbg:#e6f0ea;--blk:#0f0f10;--g:#12804a;--gbg:#e4f6ec;--o:#c2650c;--obg:#fff1e0;--b:#2463d6;--bbg:#e7effd;--sh:0 1px 2px rgba(30,0,0,.04),0 8px 24px rgba(40,0,0,.06)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#e9e4e3}
body{font-family:AcademyPlex,Tahoma,sans-serif;color:var(--ink);font-size:14px;min-height:100vh}
button{font-family:inherit;cursor:pointer;color:var(--ink);background:none;border:0}

option{color:var(--ink);background:#fff}
svg{flex-shrink:0;display:block}
.top{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--blk);color:#fff;flex-wrap:wrap}
.top img{width:38px;height:38px;border-radius:11px}.top b{font-size:17px;font-weight:800}.top b span{color:#ff4d4d}

.stage{display:flex;gap:34px;justify-content:center;align-items:flex-start;padding:28px 20px 44px}
.guide{width:300px;background:#fff;border-radius:22px;padding:20px;box-shadow:var(--sh);position:sticky;top:20px}
.guide h2{font-size:19px;font-weight:800}.guide .who{color:var(--mut);font-size:12.5px;margin-bottom:8px}
.guide p{font-size:13px;color:var(--ink2);line-height:1.75}
.guide .sl{margin-top:14px;display:flex;flex-direction:column;gap:3px}

.guide .sl button:hover{background:#f7f3f3}.guide .sl button.on{background:var(--redbg);color:var(--red2)}
.phone{width:392px;height:820px;border-radius:54px;background:#0b0b0c;padding:11px;box-shadow:0 0 0 2px #2a2a2c,0 40px 80px rgba(0,0,0,.28);flex-shrink:0}

.tab button.on{color:var(--red)}.tab button.on i{background:var(--redbg)}
.tab .bd{position:absolute;top:-2px;left:calc(50% - 22px);background:var(--red);color:#fff;font-size:10px;font-style:normal;border-radius:10px;padding:0 5px;min-width:17px;line-height:17px;border:2px solid #fff}
.hero{background:radial-gradient(130% 100% at 100% 0%,#c0161e 0%,#4a0b0e 42%,#0f0f10 78%);color:#fff;padding:6px 18px 22px;border-radius:0 0 30px 30px}

.hb{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff;position:relative}

.hdr{display:flex;align-items:center;gap:10px;min-height:44px}
.hd h1{font-size:24px;font-weight:900;letter-spacing:-.4px}

.pad{padding:12px 16px 0}

.row{display:flex;align-items:center;gap:10px}.f1{flex:1;min-width:0}.mt{margin-top:12px}.mt6{margin-top:6px}
.mut{color:var(--mut);font-size:12.5px}.sm{font-size:11.5px}

.btn.full{width:100%}.btn[disabled]{opacity:.4}
.seg{display:flex;background:#ebe5e4;border-radius:14px;padding:4px;gap:2px}

.chips{display:flex;flex-wrap:wrap;gap:7px}

.p-g{background:var(--gbg);color:var(--g)}.p-r{background:var(--redbg);color:var(--red2)}.p-o{background:var(--obg);color:var(--o)}.p-b{background:var(--bbg);color:var(--b)}.p-x{background:#f1ecec;color:var(--mut)}.p-w{background:rgba(255,255,255,.16);color:#fff}
.lst .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.lst .it:last-child{border:0;padding-bottom:2px}.lst .it:first-child{padding-top:2px}
.lst .it.tap{cursor:pointer}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
.i-r{background:var(--redbg);color:var(--red)}.i-g{background:var(--gbg);color:var(--g)}.i-o{background:var(--obg);color:var(--o)}.i-b{background:var(--bbg);color:var(--b)}.i-k{background:#f1ecec;color:var(--ink2)}.i-y{background:#fff6d8;color:#a77a00}
.av{border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex-shrink:0}
.chev{color:#c9bfbd}

.pbar.w{background:rgba(255,255,255,.18)}.pbar.w i{background:#fff}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.st{background:#fff;border-radius:18px;padding:12px 6px;text-align:center;box-shadow:var(--sh)}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stars{color:#e8a20f;letter-spacing:-1px}.stars i{color:#e3dad8;font-style:normal}
.ring{width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--c,var(--red)) calc(var(--p)*1%),var(--rb,#f1eaea) 0);display:grid;place-items:center;flex-shrink:0}
.ring span{width:76px;height:76px;border-radius:50%;background:var(--ri,#fff);display:grid;place-items:center;text-align:center;font-weight:900;font-size:20px;line-height:1.05}
.ring small{display:block;font-size:10.5px;opacity:.7;font-weight:700}
.crit{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12.5px}.crit .bar{flex:1;height:7px;background:#f1eaea;border-radius:5px;overflow:hidden}.crit .bar i{display:block;height:100%;background:var(--blk);border-radius:5px}
.note{border-radius:14px;padding:10px 12px;font-size:12.5px;margin-top:10px;display:flex;gap:8px;align-items:flex-start}

.prompt{background:linear-gradient(120deg,#fff3cf,#fffaf0);cursor:pointer}

.waterg{display:flex;gap:5px;flex-wrap:wrap}.waterg button{width:22px;height:30px;border-radius:5px 5px 9px 9px;border:2px solid #9cc4f0;background:#fff}

.tm{border-radius:20px;overflow:hidden;background:#fff;margin-bottom:12px;box-shadow:var(--sh)}
.tm .th{padding:11px 14px;font-weight:900;display:flex;align-items:center;gap:8px}
.tm .pl{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.tm .pl.sel{background:var(--redbg);box-shadow:inset 3px 0 0 var(--red)}
.pos{font-size:10.5px;font-weight:800;border-radius:7px;padding:1px 7px;background:#f1ecec;color:var(--mut)}.pos.gk{background:#fff4cc;color:#8a6a00}
.score{display:flex;align-items:center;justify-content:center;gap:20px;padding:18px;background:radial-gradient(120% 120% at 50% 0%,#3a0b0d,#0f0f10);color:#fff;border-radius:24px;margin-bottom:12px}
.score .s{font-size:44px;font-weight:900;min-width:40px;text-align:center}.score .t{text-align:center;font-weight:800;font-size:13px;opacity:.85}
.chat{padding:12px 14px 120px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:78%;padding:9px 13px;border-radius:18px;font-size:13.5px;line-height:1.6}
.bub.me{align-self:flex-start;background:var(--red);color:#fff;border-bottom-right-radius:6px}
.bub.them{align-self:flex-end;background:#fff;box-shadow:var(--sh);border-bottom-left-radius:6px}
.bub small{display:block;font-size:10px;opacity:.65;margin-top:2px}
.daysep{align-self:center;font-size:11px;color:var(--mut);background:#ebe5e4;border-radius:10px;padding:2px 10px;margin:6px 0}
.cbar{position:absolute;left:0;right:0;bottom:0;background:#fff;padding:10px 12px 26px;display:flex;gap:8px;align-items:center;box-shadow:0 -1px 0 var(--line);z-index:5}
.cbar input{border-radius:22px;padding:11px 16px}
.sendb{width:44px;height:44px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;flex-shrink:0}
.qrep{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px;position:absolute;left:0;right:0;bottom:82px;z-index:5}
.qrep button{background:#fff;border-radius:16px;padding:6px 12px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:var(--sh)}
.scan{position:relative;width:230px;height:230px;margin:10px auto;border-radius:26px;background:radial-gradient(#3b3b3e,#111);overflow:hidden}
.scan .cn{position:absolute;width:44px;height:44px;border:4px solid #fff}
.scan .c1{top:16px;right:16px;border-left:0;border-bottom:0;border-radius:0 14px 0 0}.scan .c2{top:16px;left:16px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.scan .c3{bottom:16px;right:16px;border-left:0;border-top:0;border-radius:0 0 14px 0}.scan .c4{bottom:16px;left:16px;border-right:0;border-top:0;border-radius:0 0 0 14px}
.scan .ln{position:absolute;left:24px;right:24px;height:3px;background:var(--red);box-shadow:0 0 14px var(--red);animation:sc 2s ease-in-out infinite}
@keyframes sc{0%,100%{top:30px}50%{top:196px}}
.okc{width:84px;height:84px;border-radius:50%;background:var(--gbg);color:var(--g);display:grid;place-items:center;margin:8px auto}
.thumb{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex-shrink:0}
.sov{position:absolute;inset:0;background:rgba(10,0,0,.42);opacity:0;pointer-events:none;transition:.22s;z-index:10}
.sov.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:30px 30px 0 0;padding:10px 18px 30px;transform:translateY(105%);transition:.28s cubic-bezier(.2,.8,.2,1);z-index:11;max-height:88%;overflow-y:auto}
.sheet.show{transform:none}
.grab{width:42px;height:5px;border-radius:4px;background:#e2dad8;margin:0 auto 14px}
.sheet h3{font-size:19px;font-weight:900;margin-bottom:2px}
.fld{margin-bottom:14px}.fld label{display:block;font-size:12.5px;font-weight:800;color:var(--ink2);margin-bottom:7px}
.starin{display:flex;gap:4px;direction:ltr;justify-content:flex-end}
.starin button{font-size:26px;color:#e3dad8;line-height:1}.starin button.on{color:#f0a90e}
.toast{position:absolute;bottom:104px;left:50%;transform:translate(-50%,10px);background:var(--blk);color:#fff;padding:10px 18px;border-radius:16px;font-weight:700;font-size:13px;opacity:0;transition:.25s;z-index:20;pointer-events:none;width:max-content;max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ph2{background:#efe9fb;color:#6b46c1;font-size:10.5px;padding:1px 7px;border-radius:7px;font-weight:800}
.tg{width:46px;height:28px;border-radius:20px;background:#ddd3d1;position:relative;flex-shrink:0}
.tg.on{background:var(--red)}
.tg::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on::after{right:21px}
.srch{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:0 14px;box-shadow:var(--sh);color:var(--mut)}

.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:12px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px;color:var(--mut)}
.bars i{display:block;width:100%;background:linear-gradient(var(--red),#f0575c);border-radius:8px 8px 3px 3px}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.dots span{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;background:#f4efee;color:var(--mut)}
.dots .y{background:var(--red);color:#fff}.dots .n{background:#fff;box-shadow:inset 0 0 0 1.5px #f0b5b7;color:var(--red2)}.dots .f{background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
@media (max-width:780px){.guide{display:none}.stage{padding:0}}
@media (max-width:520px){
 .top{padding:10px 12px}.top .tt{display:none}.sw{margin:0 auto}.sw button{padding:7px 10px;font-size:12px}
 .phone{width:100%;height:calc(100dvh - 62px);border-radius:0;padding:0;box-shadow:none}
 .scr{border-radius:0}.status{display:none}
}
.grip{color:#bdb1af;touch-action:none;cursor:grab;padding:6px 3px;display:grid;place-items:center;flex-shrink:0;margin-inline-start:-6px}
.grip:active{cursor:grabbing;color:#2d604c}
.drag-ghost{position:fixed;z-index:9999;pointer-events:none;background:#fff;box-shadow:0 18px 40px rgba(0,0,0,.28);border-radius:14px;transform:rotate(-2deg) scale(1.04);display:flex;align-items:center;gap:8px;padding:10px 14px;font-family:AcademyPlex,sans-serif;font-size:14px}
.drag-src{opacity:.3}
.drop-on{outline:3px dashed #2d604c;outline-offset:3px;transform:scale(1.015);transition:transform .12s}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
</style>

<script>

function g_requests(){return hd("الطلبات")+`<div class="pad"><div class="mut" style="margin:0 4px 12px">طلبات من تطبيق الأعضاء ومن الموظفين، والموافقة بتبلّغ صاحب الطلب على طول.</div>

function g_more(){const un=unreadFor("إدارة فرع الشيخ زايد");return hd("المزيد")+`<div class="pad">

function g_lost(){const s=MG.lseg;let b="";
 if(s==="found") b=LOST.found.map(f=>lostCard(f,f.st==="open"?`<div class="g2"><button class="btn sm ghost" onclick="toast('اتبعت تذكير للأعضاء')">${ic('send',15)} فكّرهم</button><button class="btn sm ghost" onclick="g_lf(${f.id},'done')">اتسلّم</button></div>`:f.st==="claimed"?`<div class="note n-b" style="margin:0 0 8px">${ic('user',16)}<div class="f1"><b>${f.by}</b> قال إنه صاحبها. اتأكد من بطاقته قبل التسليم.</div></div><button class="btn sm full" onclick="g_lf(${f.id},'done')">${ic('ok',16)} سلّمتها</button>`:"",1)).join("");
 else b=LOST.reports.map(r=>lostCard(Object.assign({},r,{rep:r.by}),r.st==="search"?`<button class="btn sm full soft" onclick="g_lr(${r.id})">${ic('ok',16)} لقيناها، بلّغه</button>`:'',1)).join("");
 return hd("المفقودات","gmore")+`<div class="pad">${seg([["found","لقيناها ("+LOST.found.filter(f=>f.st!=='done').length+")"],["rep","بلاغات الأعضاء ("+LOST.reports.filter(r=>r.st==='search').length+")"]],s,"g_ls")}<div class="mt">${b}</div><button class="btn full" onclick="sheet(lostS('mgr'))">${ic('plus',18)} لقيت حاجة ومش عارف صاحبها</button></div>`}
function g_lf(id,st){const f=LOST.found.find(x=>x.id===id);f.st=st;if(!f.by)f.by="عضو";draw();toast('اتسلّمت واتبلّغ العضو')}
function g_lr(id){const r=LOST.reports.find(x=>x.id===id);r.st="found";draw();toast('اتبلّغ '+r.by+' إنها اتلقت')}
function g_ls(k){MG.lseg=k;draw()}
function g_qr(){return hd("كود الحضور","gmore")+`<div class="pad"><div class="card" style="text-align:center"><b class="ttl">ملعب 1 · فرع الشيخ زايد</b><div class="mut sm">الأعضاء بيمسحوه من تطبيقهم أول ما يوصلوا</div><div style="display:grid;place-items:center;padding:18px"><div style="padding:16px;border-radius:24px;box-shadow:var(--sh)">${qrSvg(200)}</div></div><div class="row" style="justify-content:center;gap:10px"><button class="btn sm ghost" onclick="toast('PDF جاهز للطباعة')">اطبع</button><button class="btn sm ghost" onclick="toast('ملعب 2')">ملعب 2</button></div></div>
 <div class="card lst" style="padding:6px 16px"><div class="it"><span class="f1"><b>يتغير كل يوم</b><div class="mut sm">عشان محدش يسجّل من صورة قديمة</div></span><button class="tg on" onclick="tgl(this)"></button></div><div class="it"><span class="f1"><b>لازم يبقى في الفرع</b><div class="mut sm">التطبيق بيتأكد من الموقع</div></span><button class="tg on" onclick="tgl(this)"></button></div><div class="it"><span class="f1"><b>بيشتغل قبل الحصة بـ</b></span><span class="pill p-x">30 دقيقة</span></div></div></div>`}
function g_sess(){return hd("الحصص","gmore")+`<div class="pad">${GS.map((s,i)=>{const c=MG.sess[i];return `<div class="card"><div class="row"><div class="f1"><b>${s[0]}</b><div class="mut sm">${s[1]} · ${s[2]}</div></div><span class="pill ${c?'p-r':s[4]}">${c||s[3]}</span></div>${s[5]?`<div class="pbar mt"><i style="width:${s[5]}%"></i></div><div class="row mt6"><span class="mut sm f1">حضور ${s[6]} · 2 ماتش</span><button class="btn sm ghost" onclick="C.g='A';go('gteams')">${ic('bolt',15)} التقسيمة</button></div>`:`<div class="g2 mt"><button class="btn sm ghost" onclick="sheet(g_cancelS(${i}))">نقل / إلغاء</button><button class="btn sm ghost" onclick="C.g=${i===2?"'B'":"'A'"};go('gteams')">${ic('bolt',15)} التقسيمة</button></div>`}</div>`}).join("")}</div>`}
function g_cancelS(i){return `<h3>${GS[i][0]} · ${GS[i][1]}</h3><div class="fld mt"><label>الإجراء</label><div class="chips" id="ca">${["نقل لميعاد تاني","إلغاء + تعويض","إلغاء"].map((x,j)=>`<button class="chip ${j?'':'on'}" onclick="pick(this)">${x}</button>`).join("")}</div></div><div class="fld"><label>الميعاد الجديد</label><input type="datetime-local" value="2026-10-02T20:00"></div><div class="row" style="margin-bottom:14px"><span class="f1">بلّغ الأعضاء والمدربين</span><button class="tg on" onclick="tgl(this)"></button></div><button class="btn full" onclick="MG.sess[${i}]=document.querySelector('#ca .on').textContent.startsWith('نقل')?'اتنقلت 8 م':'اتلغت';closeSheet();draw();toast('اتبلّغ ${GS[i][0]}')">تأكيد</button>`}
function g_reports(){const w=[["سبت",9],["أحد",6.3],["اثنين",11],["ثلاثاء",4.8],["أربعاء",8.1],["خميس",3.6],["جمعة",5.4]];return hd("التقارير","gmore")+`<div class="pad">

 <div class="card"><b>طرق الدفع</b>${[["كاش",46],["إنستاباي",38],["فودافون كاش",16]].map(x=>`<div class="crit"><span style="width:90px">${x[0]}</span><div class="bar"><i style="width:${x[1]}%;background:var(--red)"></i></div><b>${x[1]}%</b></div>`).join("")}</div>
 <div class="card"><b>تقييم الأعضاء لفرعك (سبتمبر)</b>${[["مدير الفرع",4.5],["الاستقبال",4.3],["الملعب والخدمات",3.9],["المدربين",4.6]].map(x=>`<div class="crit"><span style="width:110px">${x[0]}</span><div class="bar"><i style="width:${x[1]*20}%"></i></div><b>${x[1]}</b></div>`).join("")}<div class="note n-o">${ic('door',16)}<div class="f1">أقل بند: غرف التغيير (3.6). 7 أعضاء كتبوا إنها محتاجة نضافة أكتر.</div></div></div></div>`}

 <div class="fld"><label>الاسم</label><input id="nmN"></div><div class="fld"><label>الموبايل (واتساب)</label><input dir="ltr" placeholder="01xxxxxxxxx"></div>
 <div class="fld"><label>الجروب</label><div class="chips">${["جروب الصبح A · 18/20","جروب المغرب A · كامل","جروب الليل B · 15/22"].map((x,i)=>`<button class="chip ${i?'':'on'}" onclick="pick(this)">${x}</button>`).join("")}</div></div>

function go(s){S.scr[S.app]=s;closeSheet();draw();$("view").scrollTop=0;if(/chat$/.test(s))$("view").scrollTop=1e6}
function setApp(a){S.app=a;closeSheet();draw();$("view").scrollTop=0}
function draw(){const A=APPS[S.app],cur=S.scr[S.app],tabOn=A.sub[cur]||cur,isChat=/chat$/.test(cur);
 $("sw").innerHTML=Object.entries(APPS).map(([k,v])=>`<button class="${S.app===k?'on':''}" onclick="setApp('${k}')">${ic(v.ico,16)} ${v.name.replace('تطبيق ','')}</button>`).join("");
 $("view").innerHTML=A.F[cur]();
 $("over").innerHTML=isChat?chatOver():'';
 $("tab").style.display=isChat?'none':'';
 $("stbar").classList.toggle("dk",cur==="home");
 const badge=k=>S.app==='manager'&&k==='requests'?pend():S.app==='manager'&&k==='gmore'?lostPend()+unreadFor("إدارة فرع الشيخ زايد"):S.app==='coach'&&k==='cmsgs'?unreadFor("كابتن محمود"):S.app==='member'&&k==='more'?unreadFor(ME.n)+(RT.some(r=>!r.done)?1:0):0;
 $("tab").innerHTML=A.tabs.map(([k,icn,l])=>{const b=badge(k);return `<button class="${tabOn===k?'on':''}" onclick="go('${k}')"><i>${ic(icn,22)}</i>${l}${b?`<em class="bd">${b}</em>`:''}</button>`}).join("");
 $("guide").innerHTML=`<h2>${A.name}</h2><div class="who">${A.who}</div><p>${A.desc}</p><div class="sl">${A.list.map(([k,l])=>`<button class="${cur===k||A.sub[cur]===k&&!A.list.some(x=>x[0]===cur)?'on':''}" onclick="go('${k}')">${l}</button>`).join("")}</div>`;
 if(isChat)$("view").scrollTop=1e6;
}
draw();
